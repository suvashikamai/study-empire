<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b0f">
<title>Study Empire</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Empire">
<style>
:root{
  --bg:#050506; --p900:#0a0a0c; --p850:#121216; --p800:#17171c; --p700:#232329;
  --p600:#2e2e36; --p500:#3d3d47;
  --acc:#3ee089; --acc2:#22b26a; --gold:#f6c85a; --dan:#f2617a; --info:#5fb0f5;
  --t:#ffffff; --t2:rgba(255,255,255,.66); --t3:rgba(255,255,255,.42);
  --r-lg:20px; --r-md:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--t);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{
  font:inherit;color:var(--t);background:var(--p800);border:1px solid var(--p600);
  border-radius:12px;padding:12px 14px;width:100%;outline:none
}
input:focus,select:focus{border-color:var(--acc)}
a{color:var(--acc);text-decoration:none}

/* ---- shell ---- */
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:14px 18px;background:linear-gradient(180deg,rgba(5,5,6,.97),rgba(5,5,6,.82));
  backdrop-filter:blur(12px)}
.hdr-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#3ee089,#1c7a4c);
  display:grid;place-items:center;font-weight:800;font-size:13px;color:#04140b}
main{flex:1;padding:6px 18px 110px;max-width:760px;width:100%;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:linear-gradient(180deg,rgba(10,10,12,.72),rgba(5,5,6,.99) 42%);
  backdrop-filter:blur(14px);padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;
  font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--t3);transition:color .18s}
.nav a.on{color:var(--t)}
.nav i{font-style:normal;font-size:20px;line-height:1;filter:grayscale(1) opacity(.7);transition:filter .18s}
.nav a.on i{filter:none}

/* ---- type ---- */
h1{font-size:30px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.1}
h2{font-size:20px;font-weight:800;letter-spacing:-.025em;margin:0}
h3{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0}
.mut{color:var(--t2)}.dim{color:var(--t3)}
.xs{font-size:12px}.sm{font-size:13.5px}
.lg{font-size:22px;font-weight:800;letter-spacing:-.02em}
.lab{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--t3)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid4{grid-template-columns:repeat(4,1fr)}}

/* ---- surfaces ---- */
.card{background:var(--p850);border-radius:var(--r-lg);padding:18px}
.card+.card{margin-top:12px}
.sec{margin-top:32px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;
  padding:13px 22px;font-size:14.5px;font-weight:800;letter-spacing:-.01em;
  transition:transform .12s,filter .18s}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.4}
.pri{background:var(--acc);color:#04140b}
.pri:hover{filter:brightness(1.08)}
.gho{background:var(--p700);color:var(--t)}
.dng{background:rgba(242,97,122,.16);color:var(--dan)}
.small{padding:8px 15px;font-size:12.5px}
.full{width:100%}

.bar{height:7px;border-radius:999px;background:var(--p700);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--acc);transition:width .6s cubic-bezier(.2,.7,.3,1)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 11px;
  font-size:11px;font-weight:800;letter-spacing:.02em;background:var(--p700);color:var(--t2)}
.pill.good{background:rgba(62,224,137,.16);color:var(--acc)}
.pill.warn{background:rgba(246,200,90,.16);color:var(--gold)}
.pill.bad{background:rgba(242,97,122,.16);color:var(--dan)}

/* ---- hero ---- */
.hero{border-radius:var(--r-lg);overflow:hidden}
.hero-t{padding:22px 20px 20px;background:linear-gradient(160deg,rgba(62,224,137,.30),rgba(34,120,90,.18) 42%,var(--p850) 88%)}
.hero-b{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--p800)}
@media(min-width:600px){.hero-b{grid-template-columns:repeat(4,1fr)}}
.hero-b>div{background:var(--p850);padding:13px 15px}

/* cover-art style thumbnail */
.thumb{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:23px;
  flex:none;box-shadow:0 8px 18px -10px rgba(0,0,0,.9)}
.thumb.lgx{width:76px;height:76px;border-radius:16px;font-size:34px}

.empty{background:var(--p850);border-radius:var(--r-lg);padding:34px 22px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{font-size:38px}

.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.sheet-bg{align-items:center}}
.scrim{position:absolute;inset:0}
.sheet{position:relative;z-index:1;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;
  background:var(--p850);border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px)}
@media(min-width:600px){.sheet{border-radius:24px;padding-bottom:22px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}

.list-row{display:flex;align-items:center;gap:12px;background:var(--p850);border-radius:var(--r-md);
  padding:12px 14px}
.tick{width:27px;height:27px;border-radius:9px;border:1.6px solid var(--p500);display:grid;
  place-items:center;font-size:13px;flex:none;background:transparent;padding:0;transition:background .15s}
.tick.on{background:var(--acc);border-color:var(--acc);color:#04140b}
.chip{display:inline-block;border-radius:999px;border:1px solid var(--p600);color:var(--t2);
  padding:9px 16px;font-size:13px;font-weight:700;background:transparent;white-space:nowrap;transition:all .15s}
.chip.on{border-color:var(--acc);background:rgba(62,224,137,.13);color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* ---- city ---- */
.city-wrap{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--p900)}
#city{display:block;width:100%;height:56vh;min-height:320px;touch-action:none;user-select:none}
.hud{position:absolute;left:0;right:0;display:flex;justify-content:space-between;padding:12px;
  pointer-events:none;gap:8px}
.hud.top{top:0}.hud.bot{bottom:0;align-items:flex-end}
.hud .box,.hud button{pointer-events:auto}
.hud .box{background:rgba(5,5,6,.72);border-radius:14px;padding:10px 13px;backdrop-filter:blur(10px)}
.hud .box.r{text-align:right}

/* ---- focus ---- */
.focus{display:flex;flex-direction:column;align-items:center;gap:22px;padding:26px 0;text-align:center}
.ring{position:relative;width:264px;height:264px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.045em}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;
  background:var(--p700);color:var(--t);border-radius:999px;padding:12px 20px;font-size:13.5px;
  font-weight:700;box-shadow:0 14px 34px -10px #000;max-width:92vw;text-align:center}
.spin{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--p600);border-top-color:var(--acc);
  animation:sp 1s linear infinite;margin:70px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.center-page{flex:1;display:flex;align-items:center;justify-content:center;padding:26px 18px}
.auth{width:100%;max-width:400px}
</style>
</head>

<script type="module">
/* ============================================================================

   Everything below runs straight in the browser.

const FIREBASE = {

};

/* ---------------------------------------------------------------- helpers */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p) => p + '_' + Date.now().toString(36) + '_' + Math.floor(Math.random() * 1e6).toString(36);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function toISO(d = new Date()) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fromISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = fromISO(s); d.setDate(d.getDate() + n); return toISO(d); }
function daysBetween(a, b) { return Math.round((fromISO(b) - fromISO(a)) / 86400000); }
function weekStart(s = toISO()) { const d = fromISO(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toISO(d); }
function fmtMin(m) {
  m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60;
  return h === 0 ? r + 'm' : (r === 0 ? h + 'h' : h + 'h ' + r + 'm');
}
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = (n) => String(n).padStart(2, '0');
  return h > 0 ? p(h) + ':' + p(m) + ':' + p(s) : p(m) + ':' + p(s);
}
function minLabel(min) {
  const h = Math.floor(min / 60) % 24, m = min % 60;
  const ap = h >= 12 ? 'PM' : 'AM', h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ':' + String(m).padStart(2, '0') + ' ' + ap;
}
function dayLabel(s) {
  const d = daysBetween(toISO(), s);
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d === -1) return 'Yesterday';
  return fromISO(s).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function makeRng(seed) {
  let s = typeof seed === 'string' ? hashSeed(seed) : seed >>> 0;
  if (!s) s = 0x9e3779b9;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}

/* ------------------------------------------------------------ game config */
const XP = {
  perMin: 2, complete: 100, schedule: 50, fullDuration: 25,
  daily: 250, weekly: 1000,
  streaks: { 3: 150, 7: 500, 14: 1200, 30: 5000, 60: 9000, 100: 20000, 365: 100000 },
  breakPenaltyPerMin: 3, breakPenaltyCap: 120, freeBreakPerHour: 15
};
const CP = { perMin: 1, complete: 20, daily: 100, weekly: 400 };
const EMPIRE_XP_RATE = 0.6;
const LIMITS = { maxSessionMin: 480, maxDailyMin: 960 };

const xpForLevel = (n) => n <= 1 ? 0 : Math.floor(220 * Math.pow(n - 1, 1.65));
function levelForXp(x) { let l = 1; while (xpForLevel(l + 1) <= x && l < 999) l++; return l; }
function levelProgress(x) {
  const level = levelForXp(x), base = xpForLevel(level), next = xpForLevel(level + 1);
  const into = x - base, needed = Math.max(1, next - base);
  return { level, into, needed, pct: clamp(into / needed * 100, 0, 100) };
}

const TH_NAMES = ['Small Settlement', 'Village', 'Town', 'Large Town', 'City', 'Advanced City',
  'Metropolis', 'Mega City', 'Advanced Civilisation', 'Empire'];
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
function thTitle(l) {
  if (l <= TH_NAMES.length) return TH_NAMES[l - 1];
  const b = l - TH_NAMES.length + 1;
  return 'Empire ' + (b < ROMAN.length ? ROMAN[b] : b);
}
const thXp = (l) => l <= 1 ? 0 : Math.floor(900 * Math.pow(l - 1, 1.85));
const thPopCap = (l) => Math.floor(100 * Math.pow(l, 2.9));
const thGrid = (l) => Math.min(46, 14 + (l - 1) * 2);
function thEra(l) {
  if (l <= 1) return 'settlement'; if (l <= 2) return 'village'; if (l <= 4) return 'town';
  if (l <= 7) return 'city'; if (l <= 11) return 'metropolis'; return 'futurist';
}
function thLevelForXp(x) { let l = 1; while (thXp(l + 1) <= x && l < 200) l++; return l; }

  { id: 'shop', name: 'Shop', cat: 'Commerce', icon: '🏪', fp: 1, th: 2, cost: 220, growth: 1.5, h: 1.1, hpl: 0.3, sil: 'block', pal: P('#e3b7a0', '#c0937e', '#4c6b8a', '#ffd9a0'), pop: 10, names: ['Market Stall', 'Corner Shop', 'Store', 'Department Store', 'Retail Complex'], desc: 'Small commerce for a growing town.' },

function makeQuests(date, id, goal, n = 4) {
  const rng = makeRng(date + ':' + id);
  const pool = [];
  QUESTS.forEach((q) => { for (let i = 0; i < q.w; i++) pool.push(q); });
  const picked = [];
  let guard = 0;
  while (picked.length < n && guard++ < 200) {
    const p = pool[Math.floor(rng() * pool.length)];
    if (!picked.some((c) => c.id === p.id)) picked.push(p);
  }
  return picked.map((q) => {
    const target = q.t(goal);
    return { id: date + '_' + q.id, date, tpl: q.id, label: q.label(target), target, progress: 0, done: false, xp: q.xp, cp: q.cp };
  });
}
function questProgress(q, todays, subjects) {
  const tpl = QUESTS.find((t) => t.id === q.tpl);
  if (!tpl) return q.progress;
  if (tpl.metric === 'min') return todays.reduce((n, s) => n + s.minutes, 0);
  if (tpl.metric === 'sessions') return todays.filter((s) => s.outcome === 'completed').length;
  if (tpl.metric === 'subjects') return new Set(todays.map((s) => s.subjectId)).size;
  if (tpl.metric === 'scheduled') return todays.filter((s) => s.blockId).length;
  if (tpl.metric === 'topics') {
    const ids = new Set(todays.map((s) => s.topicId).filter(Boolean));
    let n = 0;
    subjects.forEach((s) => s.topics.forEach((t) => { if (t.done && ids.has(t.id)) n++; }));
    return n;
  }
  return q.progress;
}
/* ------------------------------------------------------------ city layout */
const PITCH = 4;
const isRoad = (x, y) => x % PITCH === 0 || y % PITCH === 0;
const shoreline = (x) => 3 + Math.sin(x * 0.35) * 1.2;
const isWater = (x, y) => y < shoreline(x);
const isBridge = (x, y) => isWater(x, y) && x % PITCH === 0;

function fpTiles(b) {
  const f = bType(b.type).fp, out = [];
  for (let dx = 0; dx < f; dx++) for (let dy = 0; dy < f; dy++) out.push(b.x + dx + ',' + (b.y + dy));
  return out;
}
function occupancy(bs) { const s = new Set(); bs.forEach((b) => fpTiles(b).forEach((t) => s.add(t))); return s; }
function fits(x, y, size, grid, taken) {
  for (let dx = 0; dx < size; dx++) for (let dy = 0; dy < size; dy++) {
    const tx = x + dx, ty = y + dy;
    if (tx < 0 || ty < 0 || tx >= grid || ty >= grid) return false;
    if (isRoad(tx, ty) || isWater(tx, ty) || taken.has(tx + ',' + ty)) return false;
  }
  return true;
}
function blockOrigins(grid) {
  const o = [];
  for (let bx = 1; bx + 2 < grid; bx += PITCH) for (let by = 1; by + 2 < grid; by += PITCH) o.push([bx, by]);
  const c = grid / 2;
  o.sort((a, b) => Math.hypot(a[0] - c, a[1] - c) - Math.hypot(b[0] - c, b[1] - c));
  return o;
}
function findPlot(empire, fp, seed) {
  const grid = thGrid(empire.th), taken = occupancy(empire.buildings);
  const rng = makeRng(seed + ':' + empire.buildings.length);
  const origins = blockOrigins(grid)
    .map((o, i) => ({ o, k: i + rng() * 1.4 })).sort((a, b) => a.k - b.k).map((e) => e.o);
  for (const [bx, by] of origins) {
    const span = 3 - fp;
    for (let ox = 0; ox <= span; ox++) for (let oy = 0; oy <= span; oy++) {
      if (fits(bx + ox, by + oy, fp, grid, taken)) return { x: bx + ox, y: by + oy };
    }
  }
  return null;
}
function townHallPlot() {
  for (const [bx, by] of blockOrigins(thGrid(1))) {
    let ok = true;
    for (let dx = 0; dx < 3 && ok; dx++) for (let dy = 0; dy < 3 && ok; dy++) if (isWater(bx + dx, by + dy)) ok = false;
    if (ok) return { x: bx, y: by };
  }
  return { x: 5, y: 5 };
}

/* ---------------------------------------------------------- empire engine */
function newEmpire(id) {
  const p = townHallPlot();
  const e = {
    uid: id, th: 1, xp: 0, level: 1, points: 0, lifetime: 0, pop: 0, condition: 100,
    focus: null, lastTick: toISO(), created: Date.now(), updated: Date.now(),
    buildings: [{ id: 'town_hall', type: 'town_hall', level: 1, x: p.x, y: p.y, variant: 0, condition: 100, progress: 0, building: false, created: Date.now() }]
  };
  recompute(e);
  return e;
}
function empireLevelForXp(x) { let l = 1; while (Math.floor(600 * Math.pow(l, 1.5)) <= x && l < 500) l++; return l; }
function recompute(e) {
  e.th = thLevelForXp(e.xp);
  e.level = empireLevelForXp(e.xp);
  const th = e.buildings.find((b) => b.type === 'town_hall');
  if (th) th.level = e.th;
  const built = e.buildings.filter((b) => !b.building);
  e.pop = Math.min(built.reduce((n, b) => n + popOf(b.type, b.level, b.condition), 0), thPopCap(e.th));
  e.condition = built.length ? Math.round(built.reduce((n, b) => n + b.condition, 0) / built.length) : 100;
  e.updated = Date.now();
  return e;
}
const nextCost = (b) => b.building ? buildCost(b.type) : upgradeCost(b.type, b.level);
const progressPct = (b) => { const c = nextCost(b); return c <= 0 ? 100 : Math.min(100, Math.round(b.progress / c * 100)); };

function investAll(e, buildingId) {
  const b = e.buildings.find((x) => x.id === buildingId);
  const out = { completed: [], upgraded: [] };
  if (!b || b.type === 'town_hall') return out;
  let guard = 0;
  while (e.points > 0 && guard++ < 200) {
    const cost = nextCost(b), give = Math.min(cost - b.progress, e.points);
    b.progress += give; e.points -= give;
    if (b.progress >= cost) {
      b.progress = 0;
      if (b.building) { b.building = false; b.level = 1; b.condition = 100; out.completed.push(b); }
      else { b.level += 1; b.condition = Math.min(100, b.condition + 15); out.upgraded.push(b); }
    } else break;
  }
  recompute(e);
  return out;
}
function applyGain(e, gainXp, gainCp) {
  const before = e.th;
  e.xp += Math.max(0, Math.round(gainXp));
  e.points += Math.max(0, Math.round(gainCp));
  e.lifetime += Math.max(0, Math.round(gainCp));
  const r = e.focus ? investAll(e, e.focus) : { completed: [], upgraded: [] };
  recompute(e);
  r.thLevelUps = Math.max(0, e.th - before);
  return r;
}
function placeBuilding(e, typeId) {
  const t = bType(typeId);
  if (t.th > e.th) return { ok: false, why: 'Needs Town Hall level ' + t.th };
  if (t.unique && e.buildings.some((b) => b.type === typeId)) return { ok: false, why: 'You can only have one ' + t.name };
  const plot = findPlot(e, t.fp, e.uid);
  if (!plot) return { ok: false, why: 'No space left — level up your Town Hall to expand' };
  const b = {
    id: uid(typeId), type: typeId, level: 0, x: plot.x, y: plot.y,
    variant: (plot.x * 7 + plot.y * 13) % 4, condition: 100, progress: 0, building: true, created: Date.now()
  };
  e.buildings.push(b);
  e.focus = b.id;
  investAll(e, b.id);
  recompute(e);
  return { ok: true, b };
}
function demolish(e, id) {
  const b = e.buildings.find((x) => x.id === id);
  if (!b || b.type === 'town_hall') return false;
  e.buildings = e.buildings.filter((x) => x.id !== id);
  if (e.focus === id) e.focus = null;
  e.points += Math.round(b.progress / 2);
  recompute(e);
  return true;
}

/* -------------------------------------------------------------- decay */
const DECAY = { grace: 2, perDay: 4, accel: 1.5, maxPerDay: 12, floor: 15, goalDay: 10, activeDay: 4 };
function conditionBand(c) {
  if (c >= 95) return 'thriving'; if (c >= 75) return 'healthy';
  if (c >= 55) return 'worn'; if (c >= 30) return 'damaged'; return 'abandoned';
}
const BAND_COPY = {
  thriving: 'Your city is thriving.',
  healthy: 'Your city is in good shape.',
  worn: 'Dust is settling on the streets.',
  damaged: 'Buildings are cracking. A few good days will fix this.',
  abandoned: 'Your city has been left alone. Study today and it starts coming back.'
};
function applyDelta(e, d) {
  e.buildings.forEach((b) => { if (!b.building) b.condition = clamp(b.condition + d, DECAY.floor, 100); });
  recompute(e);
}
function runDailyTick(e, today, activeDates, goalDates) {
  const last = e.lastTick || today;
  let gap = daysBetween(last, today);
  if (gap <= 0) { e.lastTick = today; return 0; }
  gap = Math.min(gap, 400);
  const parks = e.buildings.filter((b) => b.type === 'park' && !b.building).length;
  const built = Math.max(1, e.buildings.filter((b) => !b.building).length);
  const mitigation = 1 - Math.min(0.3, parks / built) * 0.5;
  let idle = 0, cursor = last, processed = 0;
  for (let i = 0; i < gap; i++) {
    cursor = addDays(cursor, 1); processed++;
    if (goalDates.has(cursor)) { idle = 0; applyDelta(e, DECAY.goalDay); }
    else if (activeDates.has(cursor)) { idle = 0; applyDelta(e, DECAY.activeDay); }
    else {
      idle++;
      if (idle > DECAY.grace) {
        const over = idle - DECAY.grace;
        applyDelta(e, -Math.min(DECAY.maxPerDay, DECAY.perDay + (over - 1) * DECAY.accel) * mitigation);
      }
    }
  }
  e.lastTick = today;
  recompute(e);
  return processed;
}

/* -------------------------------------------------- session -> progress */
function computeReward(planned, studied, breakMin, outcome, fromSchedule) {
  studied = clamp(Math.round(studied), 0, LIMITS.maxSessionMin);
  planned = clamp(Math.round(planned), 0, LIMITS.maxSessionMin);
  breakMin = clamp(Math.round(breakMin), 0, LIMITS.maxSessionMin);
  const lines = [];
  if (studied < 1) return { xp: 0, cp: 0, lines };
  let xp = studied * XP.perMin;
  lines.push([studied + ' min studied', xp]);
  if (outcome === 'completed') {
    xp += XP.complete; lines.push(['Session completed', XP.complete]);
    if (planned > 0 && studied >= planned) { xp += XP.fullDuration; lines.push(['Full planned duration', XP.fullDuration]); }
    if (fromSchedule) { xp += XP.schedule; lines.push(['Kept to your schedule', XP.schedule]); }
  }
  const allowance = Math.max(XP.freeBreakPerHour, studied / 60 * XP.freeBreakPerHour);
  const excess = Math.max(0, breakMin - allowance);
  if (excess > 0) {
    const pen = Math.min(XP.breakPenaltyCap, Math.round(excess * XP.breakPenaltyPerMin));
    if (pen > 0) { xp -= pen; lines.push([Math.round(excess) + ' min extra break', -pen]); }
  }
  xp = Math.max(0, Math.round(xp));
  let cp = studied * CP.perMin;
  if (outcome === 'completed') cp += CP.complete;
  return { xp, cp: Math.round(cp), lines };
}

function applySession(ctx) {
  const { profile, stats, empire, subjects, history, session } = ctx;
  const today = session.date;
  const notes = [];
  const base = computeReward(session.planned, session.minutes, session.breakMin, session.outcome, !!session.blockId);
  const all = history.filter((s) => s.id !== session.id).concat([session]);
  const todayMin = Math.min(LIMITS.maxDailyMin, all.filter((s) => s.date === today).reduce((n, s) => n + s.minutes, 0));
  const ws = weekStart(today);
  const weekMin = all.filter((s) => weekStart(s.date) === ws).reduce((n, s) => n + s.minutes, 0);

  let xp = base.xp, cp = base.cp;
  const lines = base.lines.slice();

  const goal = Math.max(10, profile.dailyGoal);
  const goalMet = todayMin >= goal;
  const goalNew = goalMet && stats.lastGoalDate !== today;
  let streak = stats.streak, streakChanged = false;

  if (goalNew) {

const ONLINE = !!(FIREBASE.apiKey && FIREBASE.projectId && FIREBASE.appId && FIREBASE.authDomain);
const NS = 'studyempire:v1';
const lsGet = (id, k, d) => { try { const r = localStorage.getItem(NS + ':' + id + ':' + k); return r ? JSON.parse(r) : d; } catch (e) { return d; } };

let FB = null;
async function loadFirebase() {
  if (FB) return FB;
  const V = 'https://www.gstatic.com/firebasejs/10.13.2/';
  const [appMod, authMod, dbMod] = await Promise.all([
    import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')

  const app = appMod.initializeApp(FIREBASE);
  FB = { auth: authMod.getAuth(app), db: dbMod.getFirestore(app), a: authMod, f: dbMod };
  return FB;
}

const cleanUser = (n) => String(n || '').toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 20);

const Repo = {
  online: ONLINE,

  async onAuth(cb) {
    if (!ONLINE) { cb({ uid: 'local', name: null }); return; }
    const { auth, a } = await loadFirebase();
    a.onAuthStateChanged(auth, (u) => cb(u ? { uid: u.uid, name: u.displayName, email: u.email } : null));
  },
  async signUp(email, pass, username, name) {
    const { auth, a } = await loadFirebase();
    const u = cleanUser(username);
    if (u.length < 3) throw new Error('Username needs at least 3 characters (a-z, 0-9, _).');
    if (!(await Repo.usernameFree(u))) throw new Error('That username is taken.');
    const cred = await a.createUserWithEmailAndPassword(auth, email, pass);
    await a.updateProfile(cred.user, { displayName: name || u });
    Repo._pending = { username: u, name: name || u };
    await Repo.claimUsername(u, cred.user.uid);
  },
  async signIn(email, pass) {
    const { auth, a } = await loadFirebase();
    await a.signInWithEmailAndPassword(auth, email, pass);
  },
  async signInGoogle() {
    const { auth, a } = await loadFirebase();
    await a.signInWithPopup(auth, new a.GoogleAuthProvider());
  },
  async signOut() {
    if (!ONLINE) return;
    const { auth, a } = await loadFirebase();
    await a.signOut(auth);
  },
  async resetPass(email) {
    const { auth, a } = await loadFirebase();
    await a.sendPasswordResetEmail(auth, email);
  },
  async usernameFree(name) {
    const { db, f } = await loadFirebase();
    return !(await f.getDoc(f.doc(db, 'usernames', cleanUser(name)))).exists();
  },
  async claimUsername(name, id) {
    try {
      const { db, f } = await loadFirebase();
      const ref = f.doc(db, 'usernames', cleanUser(name));
      const snap = await f.getDoc(ref);
      if (snap.exists()) return snap.data().uid === id;
      await f.setDoc(ref, { uid: id, at: Date.now() });
      return true;
    } catch (e) { console.warn('username claim failed', e); return false; }
  },

  async load(user) {
    if (!ONLINE) {
      const profile = lsGet(user.uid, 'profile', null);

        empire: lsGet(user.uid, 'empire', newEmpire(user.uid)),

        exams: lsGet(user.uid, 'exams', []),

      };

    const { db, f } = await loadFirebase();

    } else {

      profile = defaultProfile(id, uname, p.name || user.name || 'Scholar');
      stats = newStats();
      Repo._pending = null;
      await Repo.claimUsername(profile.username, id);
      await f.setDoc(f.doc(db, 'users', id), { profile, stats });
    }
    const cutoff = addDays(toISO(), -180);
    const col = (n) => f.collection(db, 'users', id, n);
    const [emp, subs, sess, sch, exm, meta] = await Promise.all([
      f.getDoc(f.doc(db, 'users', id, 'empire', 'main')),
      f.getDocs(col('subjects')),
      f.getDocs(f.query(col('sessions'), f.where('date', '>=', cutoff), f.orderBy('date', 'desc'), f.limit(600))),
      f.getDocs(col('schedule')),
      f.getDocs(col('exams')),
      f.getDoc(f.doc(db, 'users', id, 'meta', 'state'))
    ]);
    let empire;
    if (emp.exists()) empire = Object.assign(emp.data(), { uid: id });
    else { empire = newEmpire(id); await f.setDoc(f.doc(db, 'users', id, 'empire', 'main'), empire); }
    const m = meta.data() || {};
    return {
      fresh, profile, stats, empire,
      subjects: subs.docs.map((d) => d.data()),
      sessions: sess.docs.map((d) => d.data()),
      schedule: sch.docs.map((d) => d.data()),

  async save(id, key, value) {
    if (!ONLINE) { lsSet(id, key, value); return; }
    const { db, f } = await loadFirebase();
    if (key === 'profile') return f.setDoc(f.doc(db, 'users', id), { profile: value }, { merge: true });
    if (key === 'stats') return f.setDoc(f.doc(db, 'users', id), { stats: value }, { merge: true });
    if (key === 'empire') return f.setDoc(f.doc(db, 'users', id, 'empire', 'main'), value);
    if (key === 'quests') return f.setDoc(f.doc(db, 'users', id, 'meta', 'state'), { quests: value }, { merge: true });
    if (key === 'notes') return f.setDoc(f.doc(db, 'users', id, 'meta', 'state'), { notes: value.slice(0, 40) }, { merge: true });
  },
  async saveItem(id, col, item) {
    if (!ONLINE) {
      const list = lsGet(id, col, []);
      const i = list.findIndex((x) => x.id === item.id);
      if (i >= 0) list[i] = item; else list.push(item);
      lsSet(id, col, col === 'sessions' ? list.slice(-400) : list);
      return;
    }
    const { db, f } = await loadFirebase();
    await f.setDoc(f.doc(db, 'users', id, col, item.id), item);
  },
  async deleteItem(id, col, itemId) {
    if (!ONLINE) { lsSet(id, col, lsGet(id, col, []).filter((x) => x.id !== itemId)); return; }
    const { db, f } = await loadFirebase();
    await f.deleteDoc(f.doc(db, 'users', id, col, itemId));
  },

  async publish(pub, buildings) {
    if (!ONLINE) return;
    const { db, f } = await loadFirebase();
    try {
      await f.setDoc(f.doc(db, 'publicProfiles', pub.uid), Object.assign({}, pub, {
        buildings: buildings.map((b) => ({
          id: b.id, type: b.type, level: b.level, x: b.x, y: b.y,
          variant: b.variant, condition: b.condition, progress: 0, building: b.building
        }))
      }));
    } catch (e) { console.warn('publish failed', e); }
  },
  async findUser(name) {
    const { db, f } = await loadFirebase();
    const n = await f.getDoc(f.doc(db, 'usernames', cleanUser(name)));
    if (!n.exists()) return null;
    const p = await f.getDoc(f.doc(db, 'publicProfiles', n.data().uid));
    return p.exists() ? p.data() : null;
  },
  async sendRequest(me, toUid, toName) {
    if (me.uid === toUid) throw new Error('You are already your own best study partner.');
    const { db, f } = await loadFirebase();
    const id = [me.uid, toUid].sort().join('_');
    const ref = f.doc(db, 'friendRequests', id);
    // Checking for an existing request is a nicety, not a requirement — if the
    // read is refused (older rules deny reads of documents that do not exist
    // yet) we simply carry on and send.
    try {
      const ex = await f.getDoc(ref);
      if (ex.exists() && ex.data().status === 'pending') {
        throw new Error('A request between you two is already pending.');
      }
    } catch (err) {
      if (String(err && err.message).includes('already pending')) throw err;
      console.warn('duplicate-request check skipped', err);
    }
    await f.setDoc(ref, {
      id, fromUid: me.uid, fromUsername: me.username, fromName: me.name,
      toUid, toUsername: toName, status: 'pending', at: Date.now(), participants: [me.uid, toUid]
    });
  },
  async requests(id) {
    const { db, f } = await loadFirebase();
    const s = await f.getDocs(f.query(f.collection(db, 'friendRequests'), f.where('participants', 'array-contains', id)));
    const all = s.docs.map((d) => d.data()).filter((r) => r.status === 'pending');
    return { incoming: all.filter((r) => r.toUid === id), outgoing: all.filter((r) => r.fromUid === id) };
  },
  async respond(id, req, accept) {
    const { db, f } = await loadFirebase();
    const batch = f.writeBatch(db);
    batch.set(f.doc(db, 'friendRequests', req.id), { status: accept ? 'accepted' : 'rejected' }, { merge: true });
    if (accept) {
      const other = req.fromUid === id ? req.toUid : req.fromUid;
      const otherName = req.fromUid === id ? req.toUsername : req.fromUsername;
      const otherDisp = req.fromUid === id ? req.toUsername : req.fromName;
      const meSnap = await f.getDoc(f.doc(db, 'publicProfiles', id));
      const me = meSnap.data() || {};
      batch.set(f.doc(db, 'users', id, 'friends', other), { uid: other, username: otherName, name: otherDisp, since: Date.now() });
      batch.set(f.doc(db, 'users', other, 'friends', id), { uid: id, username: me.username || id.slice(0, 6), name: me.name || 'Scholar', since: Date.now() });
    }
    await batch.commit();
  },
  async friends(id) {
    const { db, f } = await loadFirebase();
    return (await f.getDocs(f.collection(db, 'users', id, 'friends'))).docs.map((d) => d.data());
  },
  async unfriend(id, other) {
    const { db, f } = await loadFirebase();
    const b = f.writeBatch(db);
    b.delete(f.doc(db, 'users', id, 'friends', other));
    b.delete(f.doc(db, 'users', other, 'friends', id));
    b.set(f.doc(db, 'friendRequests', [id, other].sort().join('_')), { status: 'rejected' }, { merge: true });
    await b.commit();
  },
  async publicProfiles(ids) {
    if (!ids.length) return [];
    const { db, f } = await loadFirebase();
    const rs = await Promise.all(ids.map((i) => f.getDoc(f.doc(db, 'publicProfiles', i))));
    return rs.filter((r) => r.exists()).map((r) => r.data());
  },
  async city(id) {
    const { db, f } = await loadFirebase();
    const s = await f.getDoc(f.doc(db, 'publicProfiles', id));
    return s.exists() ? s.data() : null;
  }
};

      const streakReset = reconcileStreak(S.stats, toISO());
      const ticked = runDailyTick(S.empire, toISO(), active, goals);

/* --------------------------------------------------- wall-clock ticker ---
   Counts elapsed real time rather than ticks, so the timer keeps running
   while the phone is locked, the app is backgrounded, or you are in YouTube.
   A single catch-up is capped at 3 hours so a forgotten session cannot
   silently claim a whole day. */
const MAX_CATCHUP_SEC = 3 * 3600;
function advanceTimer() {
  const a = S.active;
  if (!a || !a.running) return false;
  const now = Date.now();
  if (!a.lastAt) { a.lastAt = now; return false; }
  let delta = (now - a.lastAt) / 1000;
  a.lastAt = now;
  if (delta <= 0) return false;
  if (delta > MAX_CATCHUP_SEC) delta = MAX_CATCHUP_SEC;
  if (a.onBreak) a.breakSec += delta; else a.sec += delta;
  saveActive();
  return true;
}
setInterval(() => {
  if (advanceTimer() && S.route.name === 'focus' && !S.sheet) updateClock();
}, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (advanceTimer() && S.route.name === 'focus') updateClock();
});
window.addEventListener('focus', () => { if (advanceTimer()) updateClock(); });

function updateClock() {
  const a = S.active; if (!a) return;
  const el = $('#clock'); if (!el) { render(); return; }
  el.textContent = fmtClock(a.onBreak ? a.breakSec : a.sec);
  const target = a.planned * 60;
  const left = Math.max(0, target - a.sec);
  const sub = $('#clock-sub');
  if (sub) sub.textContent = a.onBreak ? 'On a break' : (left > 0 ? fmtClock(left) + ' to target' : 'Target reached 🎉');
  const ring = $('#ring-fg');
  if (ring) {
    const c = 2 * Math.PI * 110;
    const pct = a.onBreak ? 100 : clamp(a.sec / Math.max(1, target) * 100, 0, 100);
    ring.setAttribute('stroke-dashoffset', String(c - pct / 100 * c));
  }
  const meta = $('#focus-meta');
  if (meta) meta.textContent = focusMeta(a);
}
const focusMeta = (a) => 'Target ' + fmtMin(a.planned) + ' · studied ' + fmtMin(Math.floor(a.sec / 60)) +
  (a.breaks ? ' · ' + a.breaks + ' breaks (' + fmtMin(Math.floor(a.breakSec / 60)) + ')' : '');
/* ============================================================= actions === */

function startSession(subjectId, topicId, planned, blockId) {
  const sub = S.subjects.find((s) => s.id === subjectId);
  if (!sub) return;
  const topic = topicId ? sub.topics.find((t) => t.id === topicId) : null;
  S.active = {
    subjectId, subjectName: sub.name, topicId: topic ? topic.id : null,
    topicName: topic ? topic.name : null, planned, blockId: blockId || null,
    startedAt: Date.now(), lastAt: Date.now(), sec: 0, breakSec: 0, breaks: 0, running: true, onBreak: false
  };
  S.reward = null;
  saveActive();
  go('focus');
}

async function finishSession(outcome) {
  advanceTimer();
  const a = S.active;
  S.sheet = null;
  if (!a) return;
  const minutes = Math.floor(a.sec / 60);
  if (minutes < 1) { S.active = null; saveActive(); toast('Too short to count — study at least a minute.'); go('home'); return; }
  const session = {
    id: uid('ses'), subjectId: a.subjectId, subjectName: a.subjectName,
    topicId: a.topicId, topicName: a.topicName, planned: a.planned, minutes,
    breakMin: Math.floor(a.breakSec / 60), breaks: a.breaks, startedAt: a.startedAt,
    endedAt: Date.now(), date: toISO(), outcome, blockId: a.blockId, xp: 0, cp: 0
  };
  const before = S.quests.map((q) => q.done);
  const out = applySession({
    profile: S.profile, stats: S.stats, empire: S.empire,
    subjects: S.subjects, history: S.sessions, session
  });
  S.sessions = [session].concat(S.sessions);
  refreshQuests();
  let qxp = 0;
  S.quests.forEach((q, i) => { if (q.done && !before[i]) qxp += q.xp; });
  if (qxp) {
    S.stats.xp += qxp; S.stats.level = levelForXp(S.stats.xp);
    out.reward.xp += qxp; out.reward.lines.push(['Daily missions', qxp]);
  }
  S.notes = out.notes.concat(S.notes).slice(0, 40);
  S.active = null; saveActive();
  S.reward = out.reward;
  render();
  const id = S.profile.uid;
  await Promise.all([
    Repo.saveItem(id, 'sessions', session),
    save('stats', S.stats), save('empire', S.empire),
    save('quests', S.quests), save('notes', S.notes),
    Repo.saveItem(id, 'subjects', S.subjects.find((s) => s.id === session.subjectId))
  ].filter(Boolean));
  publishMe();
}

  breakEnd() { advanceTimer(); S.active.onBreak = false; S.active.running = true; S.active.lastAt = Date.now(); saveActive(); render(); },
  cancel() { S.active = null; saveActive(); go('home'); },
  finishYes() { finishSession('completed'); },
  finishPartial() { finishSession('partial'); },
  rewardClose() { S.reward = null; go('home'); },

  /* ---- schedule ---- */
  pickDay(d) { S.day = Number(d.v); render(); },

  async blockCreate() {

    if (kind === 'study' && !sid) { toast('Choose a subject first.'); return; }
    const [h, m] = (val('bl-time') || '18:00').split(':').map(Number);
    const repeat = S.sheet.repeat || [];
    const b = {
      id: uid('blk'), subjectId: kind === 'break' ? '' : sid, topicId: val('bl-topic') || null,
      start: h * 60 + m, duration: Number(val('bl-min')) || 60, repeat,

  /* ---- empire ---- */
  async build(d) {

  async setFocus(d) {

    publishMe();
  },
  async clearFocus() {

  },
  async demolish(d) {

    S.sheet = null; render();
    await save('empire', S.empire);
    publishMe();
  },

  /* ---- friends ---- */
  metric(d) { S.metric = d.v; render(); },
  async friendAdd() {
    const name = cleanUser(val('fr-name').replace('@', '').trim());
    if (name.length < 3) { toast('Type their username — at least 3 characters.'); return; }
    if (name === S.profile.username) { toast('That is your own friend code.'); return; }
    S.busy = true; render();
    try {
      const t = await Repo.findUser(name);

function friendlyDb(e) {
  const m = String((e && e.message) || e || '');
  if (m.includes('insufficient permissions') || m.includes('permission-denied'))
    return 'Your database rules have not been published yet — Firebase console, Firestore, Rules tab.';
  if (m.includes('unavailable') || m.includes('network')) return 'No connection to the database right now.';
  return m;
}
function friendlyAuth(m) {
  m = String(m || '');
  if (m.includes('invalid-credential') || m.includes('wrong-password')) return 'That email and password do not match.';
  if (m.includes('email-already-in-use')) return 'That email already has an account.';
  if (m.includes('weak-password')) return 'Password needs at least 6 characters.';
  if (m.includes('invalid-email')) return 'That email address looks wrong.';
  if (m.includes('popup-closed')) return 'Google sign-in was closed.';
  if (m.includes('unauthorized-domain')) return 'Add this site to Firebase → Authentication → Settings → Authorized domains.';
  if (m.includes('network-request-failed')) return 'No network connection.';
  return m.replace('Firebase: ', '');
}

      '<div class="xs mut" style="margin-top:2px">' + s.topics.length + ' topics · ' + dn + ' done · ' + fmtMin(s.minutes) + '</div></div>' +
      '<span class="dim" style="font-size:20px">›</span></div>' +
      '<div style="margin-top:14px">' + bar(dn, Math.max(1, s.topics.length), s.color) + '</div>' +
      '<div class="row xs mut" style="justify-content:space-between;margin-top:7px">' +
      '<span>' + Math.round(clamp(dn / Math.max(1, s.topics.length) * 100, 0, 100)) + '% of topics done</span>' +

}

function viewSubject(id) {

    '<div class="grow"><h1 class="trunc">' + esc(s.name) + '</h1>' +
    '<div class="xs mut">' + fmtMin(s.minutes) + ' studied · ' + s.xp.toLocaleString() + ' XP</div></div>' +
    '<button class="btn gho small" data-a="sheet" data-kind="editSubject" data-id="' + s.id + '">Edit</button></div>' +
    '<div style="margin-top:14px">' + bar(dn, Math.max(1, s.topics.length), s.color) + '</div>' +
    '<div class="xs mut" style="margin-top:6px">' + dn + '/' + s.topics.length + ' topics complete</div>' +
    '<button class="btn pri full" style="margin-top:14px" data-a="quickStart" data-id="' + s.id + '" data-min="' + S.profile.focusMin + '">Start a ' + S.profile.focusMin + ' minute session</button></div>';

  h += '<div class="sec"><div class="sec-h"><h2>Topics</h2>' +
    '<button class="btn pri small" data-a="sheet" data-kind="newTopic" data-id="' + s.id + '">+ Topic</button></div>';
  if (!s.topics.length) h += emptyBox('🧩', 'No topics yet', 'Break the subject up — DFT, FFT, FIR filters. Finishing topics pays extra XP.',
    '<button class="btn pri" data-a="sheet" data-kind="newTopic" data-id="' + s.id + '">Add a topic</button>');
  else h += '<div class="stack">' + s.topics.map((t) =>
    '<div class="list-row"><button class="tick ' + (t.done ? 'on' : '') + '" data-a="topicToggle" data-id="' + s.id + '" data-tid="' + t.id + '">' + (t.done ? '✓' : '') + '</button>' +
    '<div class="grow"><div class="sm trunc" style="font-weight:600' + (t.done ? ';color:var(--t3);text-decoration:line-through' : '') + '">' + esc(t.name) + '</div>' +

    (t.priority === 'high' ? ' · <span class="pill bad">high</span>' : '') +
    (t.difficulty === 'hard' ? ' · <span class="pill warn">hard</span>' : '') + '</div></div>' +
    '<button class="btn pri small" data-a="quickStart" data-id="' + s.id + '" data-tid="' + t.id + '" data-min="' + clamp(t.target || 50, 10, 120) + '">Study</button>' +

}

function viewSchedule() {
  const day = S.day || 0, date = addDays(toISO(), day), blocks = blocksFor(date);
  let h = '<div class="sec-h"><h1>Schedule</h1><button class="btn pri small" data-a="sheet" data-kind="newBlock">+ Block</button></div>' +
    '<div class="scroll-x">' + Array.from({ length: 14 }, (_, i) => {
      const d = addDays(toISO(), i), n = blocksFor(d).length;
      return '<button class="chip ' + (i === day ? 'on' : '') + '" style="flex-direction:column;min-width:46px;padding:7px 4px" data-a="pickDay" data-v="' + i + '">' +
        '<div class="xs" style="font-weight:700">' + DOW[fromISO(d).getDay()] + '</div>' +
        '<div style="font-weight:800">' + Number(d.slice(-2)) + '</div>' +
        '<div style="height:4px;width:4px;border-radius:999px;margin-top:3px;background:' + (n ? 'var(--acc)' : 'transparent') + '"></div></button>';
    }).join('') + '</div>' +
    '<div class="sm" style="font-weight:700;margin:14px 0 8px">' + dayLabel(date) + '</div>';
  if (!blocks.length) h += emptyBox('🗓️', 'Nothing planned', 'Add study blocks and repeat them weekly. Sessions started from the schedule earn a bonus.',
    '<button class="btn pri" data-a="sheet" data-kind="newBlock">Add a block</button>');
  else h += '<div class="stack">' + blocks.map((b) => blockRow(b, day === 0)).join('') + '</div>';

  h += '<div class="sec"><div class="sec-h"><h2>Exam plans</h2>' +
    '<button class="btn gho small" data-a="sheet" data-kind="newExam">+ Exam</button></div>';
  if (!S.exams.length) h += '<div class="card sm mut">No exams tracked. Add one and the home screen shows a countdown with topic coverage.</div>';
  else h += '<div class="stack">' + S.exams.map((e) => {
    const s = S.subjects.find((x) => x.id === e.subjectId);
    return '<div class="list-row"><div class="grow"><div class="sm" style="font-weight:700">' + esc(e.name) + '</div>' +
      '<div class="xs mut">' + esc(s ? s.name : '') + ' · ' + e.date + ' · ' + e.topics.length + ' topics</div></div>' +
      '<button class="dim" style="padding:0 4px" data-a="examDelete" data-id="' + e.id + '">✕</button></div>';
  }).join('') + '</div>';
  return h + '</div>';
}

function viewFocus() {
  const a = S.active;
  const subs = S.subjects.filter((s) => !s.archived);
  if (!a) {
    if (!subs.length) return emptyBox('📚', 'Add a subject first', 'Sessions attach to a subject so your time builds the right part of your city.',
      '<a class="btn pri" href="#/study">Go to subjects</a>');
    const chosen = val('f-subject');
    const sub = S.subjects.find((s) => s.id === chosen);
    const min = S.focusMin || S.profile.focusMin;
    return '<h1>Start a focus session</h1><div class="card stack" style="margin-top:14px">' +
      '<div><div class="lab">Subject</div><select id="f-subject" data-keep="fsubject" data-c="subjChange" style="margin-top:5px">' +
      '<option value="">Choose a subject…</option>' +
      subs.map((s) => '<option value="' + s.id + '"' + (chosen === s.id ? ' selected' : '') + '>' + s.icon + ' ' + esc(s.name) + '</option>').join('') +
      '</select></div>' +
      (sub && sub.topics.length ? '<div><div class="lab">Topic (optional)</div><select id="f-topic" style="margin-top:5px">' +
        '<option value="">No specific topic</option>' +
        sub.topics.map((t) => '<option value="' + t.id + '">' + esc(t.name) + '</option>').join('') + '</select></div>' : '') +
      '<div><div class="lab">How long?</div><div class="chips" style="margin-top:6px">' +
      [25, 30, 45, 50, 60, 90].map((d) => '<button class="chip ' + (min === d ? 'on' : '') + '" data-a="pickMin" data-v="' + d + '">' + d + 'm</button>').join('') +
      '</div></div>' +
      '<button class="btn pri full" data-a="startPicked">Start session</button></div>';
  }
  const target = a.planned * 60, pct = a.onBreak ? 100 : clamp(a.sec / Math.max(1, target) * 100, 0, 100);
  const circ = 2 * Math.PI * 110;
  return '<div class="focus">' +
    '<div><div class="lab" style="letter-spacing:.2em">' + esc(a.subjectName) + '</div>' +
    '<div style="font-size:18px;font-weight:700;margin-top:4px">' + esc(a.topicName || 'Focus session') + '</div></div>' +
    '<div class="ring"><svg width="250" height="250"><circle cx="125" cy="125" r="110" stroke="#20202a" stroke-width="12" fill="none"></circle>' +
    '<circle id="ring-fg" cx="125" cy="125" r="110" stroke="' + (a.onBreak ? '#5aa9ef' : '#39d98a') + '" stroke-width="12" fill="none" stroke-linecap="round" ' +
    'stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ - pct / 100 * circ) + '" style="transition:stroke-dashoffset .6s"></circle></svg>' +
    '<div class="mid"><div class="clock" id="clock">' + fmtClock(a.onBreak ? a.breakSec : a.sec) + '</div>' +
    '<div class="xs mut" id="clock-sub">' + (a.onBreak ? 'On a break' : (target - a.sec > 0 ? fmtClock(target - a.sec) + ' to target' : 'Target reached 🎉')) + '</div></div></div>' +
    '<div class="xs mut" id="focus-meta">' + focusMeta(a) + '</div>' +
    '<div class="row" style="flex-wrap:wrap;justify-content:center;gap:8px">' +
    (a.onBreak ? '<button class="btn pri" data-a="breakEnd">Back to studying</button>'
      : (a.running ? '<button class="btn gho" data-a="pause">Pause</button>' : '<button class="btn pri" data-a="resume">Resume</button>') +
      '<button class="btn gho" data-a="breakStart">Take a break</button>') +
    '<button class="btn pri" data-a="sheet" data-kind="finish">Finish</button></div>' +
    '<button class="xs dim" style="text-decoration:underline" data-a="cancel">Abandon session (no XP)</button></div>';
}

    '<div class="hud bot"><button class="btn pri small" data-a="sheet" data-kind="catalogue">🏗️ Build</button>' +

    '<span class="pill good">' + e.xp.toLocaleString() + ' XP</span></div>' +

    '<div class="xs" style="margin-top:8px;color:' + (e.condition >= 75 ? 'var(--acc)' : 'var(--gold)') + '">' +

    '<div class="row xs mut" style="justify-content:space-between;margin-top:6px">' +

    '<span>' + progressPct(focus) + '%</span></div>' +
    '<div class="xs dim" style="margin-top:6px">Every minute you study adds points here automatically.</div></div>'
    : '<div class="card sm mut">No building is receiving your construction points. Tap a building and choose <b>Send my points here</b>, or start a new one.</div>';

        (e.focus === b.id ? '<span class="pill good">focus</span>' : '') + '</button>';
    }).join('') + '</div></div>';
  return h;
}

function viewFriends() {
  if (!Repo.online) return emptyBox('👥', 'Multiplayer is switched off',
    'Friends, visiting cities and leaderboards need Firebase keys. Add them at the top of index.html — everything you have studied so far carries over.');
  const p = S.profile, st = S.stats, e = S.empire;
  const w = weekSessions();
  const me = publicOf(p, st, e, w.reduce((n, s) => n + s.minutes, 0), w.reduce((n, s) => n + s.xp, 0));
  const METRICS = [['weekMin', 'This week', (x) => fmtMin(x.weekMin)], ['weekXp', 'Weekly XP', (x) => x.weekXp.toLocaleString()],
  ['streak', 'Streak', (x) => x.streak + ' days'], ['xp', 'Total XP', (x) => x.xp.toLocaleString()],
  ['empireLevel', 'Empire', (x) => 'Level ' + x.empireLevel], ['pop', 'Population', (x) => x.pop.toLocaleString()],
  ['buildingCount', 'Buildings', (x) => String(x.buildingCount)]];
  const metric = S.metric || 'weekMin';
  const fmt = (METRICS.find((m) => m[0] === metric) || METRICS[0])[2];
  const board = [me].concat(S.pubs).sort((a, b) => (b[metric] || 0) - (a[metric] || 0));
  const top = Math.max(1, board[0] ? board[0][metric] : 1);

  let h = '<div class="sec-h"><h1>Friends</h1><button class="btn pri small" data-a="sheet" data-kind="addFriend">+ Add</button></div>' +
    '<div class="card"><div class="xs mut">Your friend code</div>' +
    '<div class="lg">@' + esc(p.username) + '</div>' +
    '<div class="xs dim" style="margin-top:4px">Share this so friends can add you.</div></div>';

  if (S.incoming.length) h += '<div class="sec"><h3 style="margin-bottom:8px">Requests</h3><div class="stack">' +
    S.incoming.map((r) => '<div class="list-row"><div class="grow"><div class="sm" style="font-weight:700">' + esc(r.fromName) + '</div>' +
      '<div class="xs mut">@' + esc(r.fromUsername) + '</div></div>' +
      '<button class="btn pri small" data-a="respond" data-id="' + r.id + '" data-ok="1">Accept</button>' +
      '<button class="btn gho small" data-a="respond" data-id="' + r.id + '" data-ok="0">Ignore</button></div>').join('') + '</div></div>';

  h += '<div class="sec"><h3 style="margin-bottom:8px">Leaderboard</h3><div class="scroll-x" style="margin-bottom:10px">' +
    METRICS.map((m) => '<button class="chip ' + (metric === m[0] ? 'on' : '') + '" data-a="metric" data-v="' + m[0] + '">' + m[1] + '</button>').join('') +
    '</div><div class="stack">' +
    board.map((x, i) => '<div class="card" style="padding:11px"><div class="row">' +
      '<div style="width:22px;text-align:center;font-weight:800;color:' + (i === 0 ? 'var(--gold)' : 'var(--t3)') + '">' + (i + 1) + '</div>' +
      '<div class="avatar">' + esc((x.name || '?').slice(0, 1).toUpperCase()) + '</div>' +
      '<div class="grow"><div class="sm trunc" style="font-weight:700">' + esc(x.name) +
      (x.uid === p.uid ? ' <span class="pill good">you</span>' : '') + '</div>' +
      '<div class="xs mut">Lv ' + x.level + ' · 🔥 ' + x.streak + 'd · 🏙️ TH' + x.th + '</div></div>' +
      '<div style="text-align:right"><div class="sm" style="font-weight:800">' + fmt(x) + '</div>' +
      (x.uid !== p.uid ? '<a class="xs" style="font-weight:700" href="#/visit/' + x.uid + '">Visit city →</a>' : '') + '</div></div>' +
      '<div style="margin-top:8px">' + bar(x[metric] || 0, top, x.uid === p.uid ? '#39d98a' : '#5aa9ef') + '</div></div>').join('') +
    '</div></div>';

  if (!S.friends.length && !S.incoming.length) h += '<div class="sec">' + emptyBox('🤝', 'No friends yet',
    'Study is easier when someone is quietly out-studying you. Add a friend by username.',
    '<button class="btn pri" data-a="sheet" data-kind="addFriend">Add a friend</button>') + '</div>';
  else if (S.friends.length) h += '<div class="sec"><h3 style="margin-bottom:8px">Your friends</h3><div class="stack">' +
    S.friends.map((f) => '<div class="list-row"><div class="grow"><div class="sm" style="font-weight:700">' + esc(f.name) + '</div>' +
      '<div class="xs mut">@' + esc(f.username) + '</div></div>' +
      '<a class="btn gho small" href="#/visit/' + f.uid + '">Visit</a>' +
      '<button class="dim" style="padding:0 4px" data-a="unfriend" data-id="' + f.uid + '">✕</button></div>').join('') + '</div></div>';
  return h;
}

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
    ACHIEVEMENTS.map((a) => '<div class="card" style="padding:11px' + (owned.has(a.id) ? '' : ';opacity:.4') + '">' +
      '<div style="font-size:22px">' + a.i + '</div><div class="xs" style="font-weight:700;margin-top:3px">' + a.n + '</div>' +
      '<div class="xs dim" style="line-height:1.35">' + a.d + '</div></div>').join('') + '</div></div>';

  h += '<div class="sec"><div class="sec-h"><h2>Settings</h2></div><div class="card stack">' +
    '<div><div class="lab">Daily study goal (minutes)</div><input id="set-goal" type="number" min="10" step="10" value="' + p.dailyGoal + '" style="margin-top:5px">' +
    '<div class="xs dim" style="margin-top:4px">Weekly goal is six days of this (' + fmtMin(p.dailyGoal * 6) + ').</div></div>' +
    '<div class="grid2"><div><div class="lab">Focus block</div><input id="set-focus" type="number" min="5" step="5" value="' + p.focusMin + '" style="margin-top:5px"></div>' +
    '<div><div class="lab">Break length</div><input id="set-break" type="number" min="1" value="' + p.breakMin + '" style="margin-top:5px"></div></div>' +
    '<button class="btn pri full" data-a="saveSettings">Save settings</button></div></div>';

  if (S.notes.length) h += '<div class="sec"><div class="sec-h"><h2>Recent activity</h2></div><div class="stack">' +
    S.notes.slice(0, 12).map((n) => '<div class="card" style="padding:11px"><div class="sm" style="font-weight:700">' + esc(n.title) + '</div>' +
      '<div class="xs mut">' + esc(n.body) + '</div></div>').join('') + '</div></div>';

  h += Repo.online
    ? '<button class="btn gho full" style="margin-top:18px" data-a="signout">Sign out</button>'
    : '<div class="card sm mut" style="margin-top:18px">Running in offline mode — everything is stored in this browser only. Add your Firebase keys at the top of index.html to sync across devices and unlock friends.</div>';
  return h + '<div class="xs dim" style="text-align:center;margin-top:20px">Study Empire · built for people who like watching things grow</div>';
}
/* ============================================================= sheets ==== */
function sheetWrap(title, body) {
  return '<div class="sheet-bg"><div class="scrim" data-a="close"></div><div class="sheet">' +
    '<div class="sheet-h"><h2>' + title + '</h2><button class="btn gho small" data-a="close">✕</button></div>' +
    body + '</div></div>';
}
function viewSheet() {
  const sh = S.sheet;
  if (!sh) return '';
  if (sh.kind === 'newSubject') {
    const icon = sh.icon || '📘';
    return sheetWrap('New subject',
      '<div class="stack"><div><div class="lab">Name</div><input id="sub-name" data-keep="subname" value="' + esc(keep('subname', '')) + '" placeholder="Digital Signal Processing" style="margin-top:5px"></div>' +
      '<div><div class="lab">Quick picks</div><div class="chips" style="margin-top:6px">' +
      PRESETS.slice(0, 9).map(([n, i], idx) => '<button class="chip" data-a="pickPreset" data-i="' + idx + '">' + i + ' ' + esc(n) + '</button>').join('') + '</div></div>' +
      '<div><div class="lab">Icon</div><div class="chips" style="margin-top:6px">' +
      ICONS.map((i) => '<button class="chip ' + (icon === i ? 'on' : '') + '" style="padding:7px 10px;font-size:17px" data-a="pickIcon" data-v="' + i + '">' + i + '</button>').join('') + '</div></div>' +
      '<button class="btn pri full" data-a="subjectCreate">Create subject</button></div>');
  }
  if (sh.kind === 'editSubject') {
    const s = S.subjects.find((x) => x.id === sh.id);
    if (!s) return '';
    return sheetWrap('Edit subject',
      '<div class="stack"><div><div class="lab">Name</div><input id="ed-name" value="' + esc(s.name) + '" style="margin-top:5px"></div>' +
      '<div><div class="lab">Target minutes (total)</div><input id="ed-target" type="number" min="0" step="30" value="' + s.target + '" style="margin-top:5px"></div>' +
      '<button class="btn pri full" data-a="subjectSave" data-id="' + s.id + '">Save</button>' +
      '<button class="btn gho full" data-a="subjectArchive" data-id="' + s.id + '">' + (s.archived ? 'Unarchive' : 'Archive') + ' subject</button>' +
      '<button class="btn dng full" data-a="subjectDelete" data-id="' + s.id + '">Delete subject</button></div>');
  }
  if (sh.kind === 'newTopic') {
    return sheetWrap('New topic',
      '<div class="stack"><div><div class="lab">Topic name</div><input id="top-name" placeholder="Discrete Fourier Transform" style="margin-top:5px"></div>' +
      '<div><div class="lab">Target minutes</div><input id="top-target" type="number" min="10" step="10" value="60" style="margin-top:5px"></div>' +
      '<div class="grid2"><div><div class="lab">Priority</div><select id="top-pri" style="margin-top:5px">' +
      ['low', 'normal', 'high'].map((p) => '<option' + (p === 'normal' ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></div>' +
      '<div><div class="lab">Difficulty</div><select id="top-diff" style="margin-top:5px">' +
      ['easy', 'medium', 'hard'].map((p) => '<option' + (p === 'medium' ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></div></div>' +
      '<button class="btn pri full" data-a="topicCreate" data-id="' + sh.id + '">Add topic</button></div>');
  }
  if (sh.kind === 'newBlock') {
    const kind = sh.kind2 || 'study';
    const sid = keep('subject', val('bl-subject'));
    const sub = S.subjects.find((s) => s.id === sid);
    const rep = sh.repeat || [];
    return sheetWrap('New schedule block',
      '<div class="stack"><div class="row" style="background:var(--p800);border-radius:999px;padding:4px;gap:0">' +
      ['study', 'break'].map((k) => '<button class="btn small ' + (kind === k ? 'pri' : '') + '" style="flex:1' +
        (kind === k ? '' : ';background:transparent;color:var(--t2)') + '" data-a="blockKind" data-v="' + k + '">' +
        (k === 'study' ? 'Study' : 'Break') + '</button>').join('') + '</div>' +
      (kind === 'study' ? '<div><div class="lab">Subject</div><select id="bl-subject" data-keep="subject" data-c="subjChange" style="margin-top:5px">' +
        '<option value="">Choose…</option>' + S.subjects.filter((s) => !s.archived).map((s) =>
          '<option value="' + s.id + '"' + (sid === s.id ? ' selected' : '') + '>' + s.icon + ' ' + esc(s.name) + '</option>').join('') + '</select></div>' +
        (sub && sub.topics.length ? '<div><div class="lab">Topic (optional)</div><select id="bl-topic" data-keep="topic" style="margin-top:5px">' +
          '<option value="">No specific topic</option>' + sub.topics.map((t) => '<option value="' + t.id + '"' +
            (keep('topic', '') === t.id ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('') + '</select></div>' : '') : '') +
      '<div class="grid2"><div><div class="lab">Start</div><input id="bl-time" data-keep="time" type="time" value="' + keep('time', '18:00') + '" style="margin-top:5px"></div>' +
      '<div><div class="lab">Minutes</div><input id="bl-min" data-keep="min" type="number" min="5" step="5" value="' + keep('min', '60') + '" style="margin-top:5px"></div></div>' +
      '<div><div class="lab">Repeat weekly on</div><div class="chips" style="margin-top:6px">' +
      DOW.map((d, i) => '<button class="chip ' + (rep.includes(i) ? 'on' : '') + '" style="width:38px;text-align:center;padding:8px 0" data-a="toggleRepeat" data-v="' + i + '">' + d + '</button>').join('') +
      '</div><div class="xs dim" style="margin-top:5px">Leave empty for a one-off block on ' + dayLabel(addDays(toISO(), S.day || 0)).toLowerCase() + '.</div></div>' +
      '<button class="btn pri full" data-a="blockCreate">Add to schedule</button></div>');
  }
  if (sh.kind === 'newExam') {
    const sub = S.subjects.find((s) => s.id === (sh.subject || ''));
    const picked = sh.topics || [];
    return sheetWrap('New exam plan',
      '<div class="stack"><div><div class="lab">Subject</div><select id="ex-subject" data-c="examSubject" style="margin-top:5px">' +
      '<option value="">Choose…</option>' + S.subjects.map((s) => '<option value="' + s.id + '"' +
        (sh.subject === s.id ? ' selected' : '') + '>' + s.icon + ' ' + esc(s.name) + '</option>').join('') + '</select></div>' +
      '<div><div class="lab">Exam name</div><input id="ex-name" data-keep="exname" value="' + esc(keep('exname', '')) + '" placeholder="DSP end semester" style="margin-top:5px"></div>' +
      '<div><div class="lab">Date</div><input id="ex-date" data-keep="exdate" type="date" value="' + keep('exdate', addDays(toISO(), 14)) + '" style="margin-top:5px"></div>' +
      (sub && sub.topics.length ? '<div><div class="lab">Topics in scope</div><div class="chips" style="margin-top:6px">' +
        sub.topics.map((t) => '<button class="chip ' + (picked.includes(t.id) ? 'on' : '') + '" data-a="toggleExamTopic" data-v="' + t.id + '">' + esc(t.name) + '</button>').join('') + '</div></div>' : '') +
      '<button class="btn pri full" data-a="examCreate">Track this exam</button></div>');
  }
  if (sh.kind === 'catalogue') {
    const e = S.empire;
    return sheetWrap('Build something new',
      '<div class="stack">' + unlockedTypes(e.th).map((t) => {
        const cost = buildCost(t.id), owned = e.buildings.filter((b) => b.type === t.id).length;
        return '<div class="list-row"><span style="font-size:22px">' + t.icon + '</span>' +
          '<div class="grow"><div class="sm trunc" style="font-weight:700">' + esc(t.name) +
          (owned ? ' <span class="dim">×' + owned + '</span>' : '') + '</div>' +
          '<div class="xs mut trunc">' + esc(t.desc) + '</div>' +
          '<div class="xs" style="font-weight:700;color:var(--acc);margin-top:2px">' + cost.toLocaleString() + ' points' +
          (e.points < cost ? '<span class="dim"> · keep studying to bank more</span>' : '') + '</div></div>' +
          '<button class="btn pri small" data-a="build" data-id="' + t.id + '">Build</button></div>';
      }).join('') +
      '<div class="xs dim" style="text-align:center">More buildings unlock as your Town Hall grows. Starting a build sends your banked points into it and keeps future points flowing there.</div></div>');
  }
  if (sh.kind === 'building') {
    const b = S.empire.buildings.find((x) => x.id === sh.id);
    if (!b) return '';
    const t = bType(b.type);
    return sheetWrap(esc(t.name),
      '<div class="stack"><div class="row"><span style="font-size:30px">' + t.icon + '</span><div>' +
      '<div style="font-weight:800">' + (b.building ? 'Under construction' : esc(levelName(b.type, b.level))) + '</div>' +
      '<div class="xs mut">' + t.cat + ' · houses ' + popOf(b.type, Math.max(1, b.level), b.condition).toLocaleString() + ' citizens</div></div></div>' +
      '<div class="sm mut">' + esc(t.desc) + '</div>' +
      '<div><div class="row xs mut" style="justify-content:space-between"><span>Condition</span><span>' + b.condition + '%</span></div>' +
      '<div style="margin-top:5px">' + bar(b.condition, 100, b.condition > 70 ? '#39d98a' : b.condition > 40 ? '#f5c451' : '#ef5a6f') + '</div></div>' +
      (b.type !== 'town_hall'
        ? '<div><div class="row xs mut" style="justify-content:space-between">' +
        '<span>' + (b.building ? 'Construction' : 'Upgrade to level ' + (b.level + 1)) + '</span>' +
        '<span>' + b.progress.toLocaleString() + ' / ' + nextCost(b).toLocaleString() + '</span></div>' +
        '<div style="margin-top:5px">' + bar(b.progress, nextCost(b), '#5aa9ef') + '</div></div>' +
        '<div class="row" style="gap:8px"><button class="btn pri" style="flex:1" data-a="setFocus" data-id="' + b.id + '">Send my points here</button>' +
        '<button class="btn dng" data-a="demolish" data-id="' + b.id + '">Demolish</button></div>'
        : '<div class="card xs mut" style="padding:11px">The Town Hall levels up on its own as your empire XP grows — it cannot be built or demolished.</div>') +
      '</div>');
  }
  if (sh.kind === 'addFriend') {
    return sheetWrap('Add a friend',
      '<div class="stack"><div><div class="lab">Their username</div><input id="fr-name" placeholder="rahul_ece" style="margin-top:5px"></div>' +
      '<button class="btn pri full" data-a="friendAdd"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Sending…' : 'Send request') + '</button></div>');
  }
  if (sh.kind === 'finish') {
    return sheetWrap('Finish session',
      '<p class="sm mut" style="margin:0 0 16px">Did you complete what you set out to study?</p>' +
      '<div class="stack"><button class="btn pri full" data-a="finishYes">Yes — I finished</button>' +
      '<button class="btn gho full" data-a="finishPartial">Partly — log what I did</button></div>' +
      '<div class="xs dim" style="text-align:center;margin-top:14px">Partial sessions still earn XP for every minute you actually studied.</div>');
  }
  return '';
}

function viewReward() {
  const r = S.reward;
  if (!r) return '';
  return '<div class="sheet-bg"><div class="sheet">' +
    '<div class="sheet-h"><h2>Session complete</h2><button class="btn gho small" data-a="rewardClose">✕</button></div>' +
    '<div style="text-align:center;margin-bottom:18px"><div style="font-size:44px">⚡</div>' +
    '<div style="font-size:34px;font-weight:800;color:var(--acc);letter-spacing:-.02em">+' + r.xp.toLocaleString() + ' XP</div>' +
    '<div class="sm mut">+' + r.cp.toLocaleString() + ' construction points</div></div>' +
    '<div class="stack" style="gap:6px">' + r.lines.map(([label, v]) =>
      '<div class="row" style="justify-content:space-between;background:var(--p800);border-radius:12px;padding:9px 12px">' +
      '<span class="sm mut">' + esc(label) + '</span>' +
      '<span class="sm" style="font-weight:700;color:' + (v >= 0 ? 'var(--acc)' : 'var(--dan)') + '">' + (v >= 0 ? '+' : '') + v + '</span></div>').join('') + '</div>' +
    (r.streakChanged ? '<div class="sm" style="margin-top:12px;background:rgba(245,196,81,.1);color:var(--gold);border-radius:12px;padding:9px 12px;font-weight:700">🔥 ' + r.streak + ' day streak</div>' : '') +
    (r.achievements.length ? '<div class="stack" style="margin-top:12px;gap:6px">' + r.achievements.map((id) => {
      const a = ACH[id];
      return a ? '<div style="background:var(--p800);border-radius:12px;padding:9px 12px">' +
        '<div class="sm" style="font-weight:700">' + a.i + ' ' + a.n + '</div>' +
        '<div class="xs mut">' + a.d + '</div></div>' : '';
    }).join('') + '</div>' : '') +
    '<button class="btn pri full" style="margin-top:16px" data-a="rewardClose">Back to work</button></div></div>';
}

/* ============================================================== shell ==== */
const NAV = [['home', '🏠', 'Home'], ['study', '📚', 'Study'], ['schedule', '🗓️', 'Schedule'],
['empire', '🏙️', 'Empire'], ['friends', '👥', 'Friends']];

/* A sheet re-renders whenever a dropdown inside it changes. Snapshot every
   field first so the time you typed does not snap back to its default. */
function captureSheet() {
  if (!S.sheet) return;
  document.querySelectorAll('.sheet [data-keep]').forEach((el) => {
    S.sheet['f_' + el.dataset.keep] = el.value;
  });
}
const keep = (name, fallback) => {
  const v = S.sheet && S.sheet['f_' + name];
  return v === undefined || v === '' ? fallback : v;
};

function render() {
  captureSheet();
  const root = $('#app');
  if (S.phase === 'loading') { root.innerHTML = '<div class="spin"></div>'; return; }
  if (S.phase === 'signedout') { root.innerHTML = viewAuth(); return; }
  if (S.phase === 'onboard') { root.innerHTML = viewOnboard(); return; }

  const r = S.route;
  let body = '';
  if (r.name === 'study') body = viewStudy();
  else if (r.name === 'subject') body = viewSubject(r.arg);
  else if (r.name === 'schedule') body = viewSchedule();
  else if (r.name === 'focus') body = viewFocus();
  else if (r.name === 'empire') body = viewEmpire();
  else if (r.name === 'friends') body = viewFriends();
  else if (r.name === 'visit') body = viewVisit();
  else if (r.name === 'profile') body = viewProfile();
  else body = viewHome();

  root.innerHTML =
    '<div class="hdr"><a class="hdr-brand" href="#/"><span style="font-size:19px">🏙️</span> Study Empire</a>' +
    '<div class="row" style="gap:8px">' +
    (S.active && r.name !== 'focus' ? '<a class="pill good" href="#/focus">● Session running</a>' : '') +
    '<a class="avatar" href="#/profile">' + esc(S.profile.name.slice(0, 1).toUpperCase()) + '</a></div></div>' +
    '<main>' + body + '</main>' +
    '<nav class="nav">' + NAV.map(([k, i, l]) =>
      '<a href="#/' + (k === 'home' ? '' : k) + '" class="' + (r.name === k || (k === 'home' && r.name === 'home') ? 'on' : '') + '">' +
      '<i>' + i + '</i>' + l + '</a>').join('') + '</nav>' +
    viewSheet() + viewReward() +
    (S.toast ? '<div class="toast" data-a="toastClose">' + esc(S.toast) + '</div>' : '');

  mountCity();
}

/* ------------------------------------------------------------ city mount */
let cityView = null;
function mountCity() {
  const canvas = $('#city');
  if (!canvas) { if (cityView) { cityView.stop(); cityView = null; } return; }
  let src = null;
  if (S.route.name === 'empire') src = S.empire;
  else if (S.route.name === 'visit' && S.visit && S.visit.city) {
    const c = S.visit.city;
    src = { uid: c.uid, th: c.th, buildings: c.buildings || [], terrain: c.terrain || 'valley' };
  }
  if (!src) return;
  const state = {
    seed: src.uid, grid: thGrid(src.th), th: src.th,
    buildings: src.buildings, terrain: src.terrain || 'valley'
  };
  if (cityView && cityView.c === canvas) { cityView.setState(state); return; }
  const oldCam = cityView && cityView.state.seed === state.seed ? cityView.cam : null;
  if (cityView) cityView.stop();
  cityView = new City(canvas, state);
  if (oldCam) cityView.cam = oldCam;
  cityView.start();
  attachCityInput(canvas);
}
function attachCityInput(canvas) {
  let drag = null, pinch = null;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, y: e.clientY, moved: 0 };
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag || !cityView) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    drag.x = e.clientX; drag.y = e.clientY;
    cityView.cam.x += dx; cityView.cam.y += dy;
  });
  const up = (e) => {
    if (!drag) return;
    const tap = drag.moved < 8;
    drag = null;
    if (tap && cityView && S.route.name === 'empire') {
      const b = cityView.pick(e.clientX, e.clientY);
      cityView.sel = b ? b.id : null;
      if (b) { S.sheet = { kind: 'building', id: b.id }; render(); }
    }
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', () => { drag = null; });
  canvas.addEventListener('wheel', (e) => {
    if (!cityView) return;
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    cityView.zoomBy(e.deltaY > 0 ? 0.9 : 1.1, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    if (!cityView || e.touches.length !== 2) return;
    const [a, b] = [e.touches[0], e.touches[1]];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pinch) {
      const r = canvas.getBoundingClientRect();
      cityView.zoomBy(d / pinch, (a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top);
    }
    pinch = d; drag = null;
  }, { passive: true });
  canvas.addEventListener('touchend', () => { pinch = null; });
  window.addEventListener('resize', () => { if (cityView) cityView.resize(); });
}

/* -------------------------------------------------------- service worker */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  });
}
document.addEventListener('visibilitychange', () => {
  if (!cityView) return;
  if (document.hidden) cityView.stop(); else cityView.start();
});

boot();

</script>
